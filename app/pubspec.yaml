name: local_ai_launcher
description: "Cross-platform local AI model launcher with on-device inference."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  fllama:
    git:
      url: https://github.com/Telosnex/fllama.git
      ref: main
  shelf: ^1.4.1
  shelf_router: ^1.1.4
  device_info_plus: ^13.2.0
  file_picker: ^12.0.0
  path_provider: ^2.1.5
  path: ^1.9.1
  http: ^1.2.2
  network_info_plus: ^8.2.1
  background_downloader: ^9.5.8
  flutter_local_notifications: ^22.3.0
  disk_usage: ^1.0.0
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

dependency_overrides:
  native_toolchain_cmake: 0.3.1

flutter:
  uses-material-design: true
