name: Build iOS (Placeholder Verification)
on:
  workflow_dispatch:
jobs:
  build-ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Flutter pub get
        run: flutter pub get
      - name: Build iOS (no codesign, verification only)
        run: flutter build ios --release --no-codesign --no-codesign
      - name: Verification note
        run: |
          echo "iOS build verification complete."
          echo "For full .ipa generation, run on a macOS environment with:"
          echo "  flutter build ios --release"
          echo "Then package and sign with Feather/ArcticSign for sideloading."
          echo "LiveContainer compatibility notes:"
          echo "  - No background modes required"
          echo "  - No App Groups needed"
          echo "  - No push notifications"
          echo "  - Standard ad-hoc provisioning is sufficient"
